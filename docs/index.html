<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9d3837"><meta name="description" content="大甲媽祖遶境宮廟巡禮，手機可安裝的打卡網站，搜尋宮廟、地圖導航與行程紀錄。"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>大甲媽祖・遶境智慧打卡</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#4c3430;background:#fff8f1}*{box-sizing:border-box}body{margin:0}header{background:#9d3837;color:#fff;padding:18px max(20px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center}header b{font-size:21px}header small{opacity:.85}.wrap{max-width:1080px;margin:auto;padding:24px 18px}.hero{background:linear-gradient(120deg,#ffdfb8,#ffece1);border-radius:24px;padding:32px;display:grid;grid-template-columns:1fr auto;gap:20px}.hero h1{font-size:32px;margin:8px 0}.hero p{line-height:1.7}.stamp{font-size:84px;align-self:center}.stat{display:flex;align-items:center;gap:15px;margin-top:18px}.count{font-size:25px;font-weight:800;color:#a23d37}.bar{height:10px;background:#efd4c3;border-radius:12px;overflow:hidden;flex:1}.fill{height:100%;background:#c75d4c;width:0%}.notice{padding:14px 18px;background:#fff;border:1px solid #efd6c7;border-radius:12px;margin:18px 0;color:#855e4e}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{cursor:pointer;font:inherit}nav button{background:#fff;border:1px solid #e4bcae;border-radius:22px;padding:9px 17px;color:#77433c}nav button.active{background:#a4433d;color:white}.tools{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.tools input{border:1px solid #e7c9b9;border-radius:12px;padding:12px 14px;font:inherit;min-width:250px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:16px;margin-top:18px}.card{background:white;border:1px solid #f1dfd5;border-radius:18px;padding:20px;box-shadow:0 6px 16px #673c2410}.card h3{margin:0 0 8px;font-size:19px}.muted{color:#94796c;font-size:14px}.actions{display:flex;gap:10px;margin-top:18px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:10px;border:1px solid #bb6457;color:#a1463d;background:white}.actions button{background:#a1463d;color:white}.actions button:disabled{background:#d2b4a9;border-color:#d2b4a9}.pill{font-size:12px;color:#ad6545;background:#fff0e6;border-radius:20px;padding:4px 8px;display:inline-block;margin-top:10px}.done{color:#25865b;background:#e4f6e8}.foot{text-align:center;color:#987e71;font-size:13px;padding:32px}@media(max-width:600px){.hero{padding:22px}.hero h1{font-size:25px}.stamp{font-size:50px}header small{display:none}.wrap{padding:14px 12px}.grid{grid-template-columns:1fr}.actions a,.actions button{min-height:44px}}
 .install{background:#fff;border:1px solid #dba998;color:#943c37;border-radius:12px;padding:10px 14px;font-weight:700}.install[hidden]{display:none}.tips{font-size:13px;color:#805a50;margin-top:8px}</style></head><body><header><b>🏮 大甲媽祖・遶境智慧打卡</b><small>宮廟巡禮・旅程紀錄</small></header><main class="wrap"><section class="hero"><div><div>🙏 跟著媽祖的腳步</div><h1>一步一腳印，平安走透透</h1><p>探索沿途宮廟、開啟地圖導航，留下屬於自己的遶境足跡。</p><div class="stat"><span class="count" id="progress">0 / 32</span><div class="bar"><div class="fill" id="fill"></div></div></div></div><div class="stamp">🏮</div></section><div style="margin-top:14px"><button id="install" class="install" hidden>📲 安裝到手機主畫面</button><div id="installHelp" class="tips">手機可透過瀏覽器選單「加入主畫面」安裝此網站。</div></div><div class="notice">✨ <strong>互動展示版</strong>：可體驗搜尋、地圖與模擬打卡；不使用真實 GPS 驗證。正式 APP 需核對宮廟座標，才能開放 50 公尺定位打卡。</div><div class="tools"><h2>沿途宮廟 <span id="total"></span></h2><input id="search" placeholder="🔍 搜尋宮廟名稱或地區" aria-label="搜尋宮廟"></div><nav id="filters"></nav><div class="grid" id="cards"></div><div class="foot">大甲媽祖遶境智慧打卡｜宮廟清單依使用者提供資料整理，非官方即時路線</div></main><script>
let temples=[],city='全部';const key='mazu_demo_checkins';let checked=new Set(JSON.parse(localStorage.getItem(key)||'[]'));const $=id=>document.getElementById(id);function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.trim();const cities=['全部',...new Set(temples.map(t=>t.city))];$('filters').innerHTML=cities.map(c=>`<button class="${c===city?'active':''}" data-city="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{city=b.dataset.city;render()});const rows=temples.filter(t=>(city==='全部'||t.city===city)&&`${t.name}${t.city}${t.district}`.includes(q));$('total').textContent=`(${rows.length})`;$('progress').textContent=`${checked.size} / ${temples.length}`;$('fill').style.width=(temples.length?checked.size/temples.length*100:0)+'%';$('cards').innerHTML=rows.map(t=>{const done=checked.has(t.id);const query=encodeURIComponent(t.city+t.district+t.name);return `<article class="card"><h3>⛩️ ${escapeHtml(t.name)}</h3><div class="muted">📍 ${escapeHtml(t.city)}・${escapeHtml(t.district)}</div>${t.notes?`<div class="pill">${escapeHtml(t.notes)}</div>`:''}<div class="pill ${done?'done':''}">${done?'✓ 已完成展示打卡':'○ 尚未打卡'}</div><div class="actions"><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${query}">🗺️ 地圖</a><button data-id="${t.id}">${done?'取消紀錄':'📸 模擬打卡'}</button></div></article>`}).join('');$('cards').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(checked.has(b.dataset.id))checked.delete(b.dataset.id);else checked.add(b.dataset.id);localStorage.setItem(key,JSON.stringify([...checked]));render()})}fetch('./temple_data.json').then(r=>{if(!r.ok)throw Error('資料無法載入');return r.json()}).then(data=>{temples=data;render()}).catch(()=>{$('cards').textContent='資料讀取失敗，請透過網站伺服器或 GitHub Pages 開啟。'});$('search').addEventListener('input',render);
let deferredInstall;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('install').hidden=false});document.getElementById('install').addEventListener('click',async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;document.getElementById('install').hidden=true});window.addEventListener('appinstalled',()=>{document.getElementById('install').hidden=true;document.getElementById('installHelp').textContent='已安裝到手機主畫面'});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script></body></html>
